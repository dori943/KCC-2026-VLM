tasks:
  task1:
    name: card_from_gap
    image: cases/images/card_from_gap.png
    task_scene_image: cases/task_scene_images/card_from_gap.png
    target_name: "emergency prescription paper"
    description: "거실 두 가구 사이의 좁은 틈에 끼인 응급 처방전을 꺼내야 한다. 종이가 구겨지거나 찢어지면 처방전이 무효 처리되어 약을 받을 수 없으므로, 평면 형태를 유지한 채로 꺼내야 한다. 좁은 틈은 사람 손가락이 들어가지 않는 폭이다."
    scene_info: ../scene_info_case1.json

  task2:
    name: deep_hole_reach
    image: cases/images/deep_hole_reach.png
    task_scene_image: cases/task_scene_images/deep_hole_reach.png
    target_name: "car key in sewer drain"
    description: "도시 길거리 하수구 격자 사이로 떨어진 자동차 키를 회수해야 한다. 격자의 슬릿은 사람 손이 들어가지 않을 정도로 좁아서, 도구 없이는 키에 접근할 수 없다. 키 없이는 차 잠금 해제가 불가능하다."
    scene_info: ../scene_info_case2.json

  task3:
    name: suspended_target
    image: cases/images/suspended_target.png
    task_scene_image: cases/task_scene_images/suspended_target.png
    target_name: "suspended medicine bottle on string"
    description: "부엌 선반 모서리의 가느다란 끈에 매달려 공중에 떠 있는 응급 약병을 안전하게 회수해야 한다. 끈은 약하기 때문에 일정 장력 이상이 가해지면 즉시 끊어지며, 그 경우 약병이 바닥으로 떨어져 깨진다. 환자가 약을 기다리고 있어 부드럽게 받쳐 회수해야 한다."
    scene_info: ../scene_info_case3.json

  task4:
    name: blocked_door_handle
    image: cases/images/blocked_door_handle.png
    task_scene_image: cases/task_scene_images/blocked_door_handle.png
    target_name: "door handle behind fallen bookshelf"
    description: "지진으로 무너진 무거운 책장이 닫힌 방문 앞을 가로막아, 책장 위쪽으로만 좁은 공간이 남았다. 그 너머 방에 갇힌 사람을 구조하려면 책장 너머의 문 손잡이를 회전시켜 문을 열어야 한다. 책장은 너무 무거워 옮길 수 없다."
    scene_info: ../scene_info_case4.json

  task5:
    name: glass_shard_extract
    image: cases/images/glass_shard_extract.png
    task_scene_image: cases/task_scene_images/glass_shard_extract.png
    target_name: "hearing aid battery in glass shards"
    description: "주방 바닥에 깨진 유리컵 파편 더미 속에 떨어진 노인의 보청기용 단추형 배터리를 회수해야 한다. 직접 접촉 시 유리에 베일 위험이 있고, 배터리가 손상되면 보청기를 사용할 수 없다. 안전 거리를 유지하며 부드럽게 부품만 분리해야 한다."
    scene_info: ../scene_info_case5.json

  task6:
    name: pet_cage_fire_rescue
    image: cases/images/pet_cage_fire_rescue.png
    target_name: "heated cage door latch"
    description: "화재 상황에서 반려동물이 작은 케이지 안에 갇혀 있다. 케이지 문 고리는 뜨거운 금속 파편 뒤쪽에 있어 직접 접근이 어렵다. 문 고리 쪽에 힘을 전달해 케이지 문을 열어야 하며, 안에 있는 반려동물이 다치지 않도록 접촉 충격을 줄여야 한다."
    scene_info: ../scene_info_pet_cage.json

  task7:
    name: scene_1_glass_shard_sweep
    image: cases/images/glass_shard_extract.png
    target_name: "scattered glass shards on kitchen floor"
    description: "Scene 1 emergency cleanup. Glass shards are widely scattered on the kitchen floor, so direct hand contact is unsafe. Using only YCB 033_spatula has limited sweep width. Using only YCB 003_cracker_box by hand brings the operator too close to shards. Build and use a combined tool from YCB 033_spatula and YCB 003_cracker_box to gather shards to one side without direct contact."
    scene_info: ../scene_info_case1.json
