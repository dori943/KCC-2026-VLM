rule_version: "0.1"
weights:
  semantic_match_score: 0.40
  target_state_change_alignment: 0.20
  visibility_score: 0.15
  accessibility_score: 0.15
  relation_evidence_score: 0.10
visibility_score_map:
  full: 1.0
  partial: 0.7
  heavily_occluded: 0.4
accessibility_score_map:
  clear: 1.0
  partial: 0.75
  occluded: 0.45
  nested: 0.40
  entangled: 0.35
thresholds:
  resolved_score_min: 0.60
  partial_score_min: 0.45
  ambiguous_margin_max: 0.08
  strong_margin_min: 0.10
  multiple_score_min: 0.52
semantic:
  exact_match_bonus: 0.50
  alias_match_bonus: 0.35
  substring_bonus: 0.20
  note_keyword_bonus: 0.10
  canonical_type_bonus: 0.30
  max_semantic_raw: 1.0
relation_evidence:
  supported_relations:
    - inside
    - partially_inside
    - in_container
    - between_surfaces
    - against
    - under
    - on
    - touching
  relation_task_tokens:
    inside:
      - inside
      - in
      - within
      - stuck
    partially_inside:
      - partly
      - partial
      - half
      - stuck
    between_surfaces:
      - between
      - gap
      - slot
      - narrow
    under:
      - under
      - below
      - beneath
      - overhang
    against:
      - against
      - edge
      - side
status_policy:
  implicit_on_missing_target_carrier: true
  deferred_reason_missing_target_carrier: missing_upstream_target_carrier
  deferred_reason_low_evidence: insufficient_target_evidence
