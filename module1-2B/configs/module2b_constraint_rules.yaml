rule_version: "0.1"
priority_order:
  high: 1
  medium: 2
  low: 3
defaults:
  geometric_hardness: hard
  stability_hardness: hard
  support_preference_hardness: soft
measurement_to_constraints:
  opening_width:
    - category: geometric
      parameter_name: max_tool_body_width
      applies_to: tool_profile
      hardness: hard
      priority: high
      bound_transform: upper_minus_margin
    - category: geometric
      parameter_name: max_cross_section_width
      applies_to: tool_profile
      hardness: hard
      priority: high
      bound_transform: upper_minus_margin
  neck_inner_diameter:
    - category: geometric
      parameter_name: max_tip_diameter
      applies_to: tool_profile
      hardness: hard
      priority: high
      bound_transform: upper_minus_margin
  lateral_clearance:
    - category: geometric
      parameter_name: max_tip_thickness
      applies_to: tool_profile
      hardness: hard
      priority: high
      bound_transform: upper_minus_margin
  recess_depth:
    - category: geometric
      parameter_name: min_insert_depth
      applies_to: approach_path
      hardness: hard
      priority: high
      bound_transform: lower_plus_margin
  reachable_depth:
    - category: geometric
      parameter_name: min_effective_reach
      applies_to: approach_path
      hardness: hard
      priority: high
      bound_transform: lower_plus_margin
  support_surface_span:
    - category: geometric
      parameter_name: min_contact_span
      applies_to: placement_strategy
      hardness: soft
      priority: medium
      bound_transform: lower_no_change
    - category: stability_access
      parameter_name: min_placement_stability_level
      applies_to: placement_strategy
      hardness: soft
      priority: medium
      bound_transform: span_to_stability_level
  available_entry_angle_deg:
    - category: stability_access
      parameter_name: max_required_entry_angle_deg
      applies_to: approach_path
      hardness: hard
      priority: high
      bound_transform: upper_no_change
topology_to_constraints:
  under_overhang:
    category: stability_access
    parameter_name: max_required_entry_angle_deg
    applies_to: approach_path
    hardness: hard
    priority: high
    unit: deg
    bound_type: upper_bound
    upper_value: 35.0
  occluding_edge:
    category: stability_access
    parameter_name: max_allowed_roll_instability_level
    applies_to: approach_path
    hardness: hard
    priority: medium
    unit: level_1_to_5
    bound_type: upper_bound
    upper_value: 2.0
  narrow_gap:
    category: mechanical
    parameter_name: min_global_stiffness_level
    applies_to: tool_profile
    hardness: soft
    priority: low
    unit: level_1_to_5
    bound_type: lower_bound
    lower_value: 3.0
constraint_units_policy:
  strong_scale_anchor: metric_strict
  mixed_anchor: mixed_metric_and_ordinal
  weak_anchor: ordinal_preferred
